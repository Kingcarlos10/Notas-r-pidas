<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Notas Rápidas</title>
  
  <!-- Icono profesional para la pantalla de inicio del iPhone -->
  <link rel="apple-touch-icon" href="https://img.icons8.com/sf-black-filled/512/007AFF/notepad.png">

  <style>
    :root {
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --text-color: #1c1c1e;
      --accent-color: #007aff;
      --delete-color: #ff3b30;
      --border-color: #e5e5ea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #1c1c1e;
        --card-bg: #2c2c2e;
        --text-color: #ffffff;
        --border-color: #3a3a3c;
      }
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
    }
    .app-container {
      padding: 12px;
      max-width: 500px;
      margin: 0 auto;
      padding-bottom: 100px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 4px 16px 4px;
    }
    header h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0;
    }
    .filter-wrapper {
      position: relative;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .filter-select-native {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .notes-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .note-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 8px 10px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .note-textarea {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text-color);
      font-size: 14px;
      resize: none;
      font-family: inherit;
      padding: 0;
      min-height: 20px;
      line-height: 18px;
    }
    .note-textarea:focus { outline: none; }
    .note-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 4px;
      border-top: 1px solid rgba(0,0,0,0.03);
    }
    .category-select {
      background: var(--bg-color);
      color: var(--text-color);
      border: none;
      padding: 2px 4px;
      border-radius: 4px;
      font-size: 11px;
      font-family: inherit;
      outline: none;
    }
    .delete-btn {
      background: none;
      border: none;
      color: var(--delete-color);
      font-size: 11px;
      cursor: pointer;
      opacity: 0.5;
      padding: 2px 4px;
    }
    .fab {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom));
      right: 20px;
      width: 46px;
      height: 46px;
      background-color: var(--accent-color);
      color: white;
      border-radius: 50%;
      border: none;
      font-size: 24px;
      box-shadow: 0 2px 8px rgba(0,122,255,0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Notas Rápidas</h1>
      <div class="filter-wrapper">
        <span id="filter-label">🔍 Filtrar: Todas</span>
        <select id="filter-select" class="filter-select-native">
          <option value="todas">🔍 Todas las notas</option>
          <option value="trabajo">💼 Trabajo</option>
          <option value="musica">🎵 Música</option>
          <option value="series">🎬 Series</option>
          <option value="restaurante">🍔 Restaurante</option>
          <option value="vino">🍷 Vino</option>
          <option value="viaje">✈️ Viaje</option>
          <option value="libros">📚 Libros</option>
          <option value="internet">🌐 App/Internet</option>
          <option value="gestion">✅ Gestión</option>
          <option value="personas">👥 Personas</option>
        </select>
      </div>
    </header>
    
    <main><div id="notes-container" class="notes-grid"></div></main>
    <button id="add-note-btn" class="fab">+</button>
  </div>

  <script>
    const notesContainer = document.getElementById('notes-container');
    const addNoteBtn = document.getElementById('add-note-btn');
    const filterSelect = document.getElementById('filter-select');
    const filterLabel = document.getElementById('filter-label');
    
    let notes = JSON.parse(localStorage.getItem('rapidas-notes')) || [];
    let currentFilter = 'todas';

    const categories = {
      trabajo: "💼 Trabajo", musica: "🎵 Música", series: "🎬 Series",
      restaurante: "🍔 Restaurante", vino: "🍷 Vino", viaje: "✈️ Viaje",
      libros: "📚 Libros", internet: "🌐 App/Internet", gestion: "✅ Gestión",
      personas: "👥 Personas"
    };

    function saveNotes() { localStorage.setItem('rapidas-notes', JSON.stringify(notes)); }
    
    function autoResizeTextarea(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
    }

    function renderNotes() {
      notesContainer.innerHTML = '';
      const filteredNotes = currentFilter === 'todas' ? notes : notes.filter(n => n.category === currentFilter);
      
      filteredNotes.forEach((note) => {
        const card = document.createElement('div');
        card.className = 'note-card';
        let optionsHtml = '';
        for (let key in categories) {
          optionsHtml += `<option value="${key}" ${note.category === key ? 'selected' : ''}>${categories[key]}</option>`;
        }
        card.innerHTML = `
          <textarea class="note-textarea" placeholder="Escribe algo...">${note.text || ''}</textarea>
          <div class="note-footer">
            <select class="category-select">${optionsHtml}</select>
            <button class="delete-btn">Eliminar</button>
          </div>
        `;
        const textarea = card.querySelector('.note-textarea');
        const select = card.querySelector('.category-select');
        const deleteBtn = card.querySelector('.delete-btn');
        
        if (note.text) { setTimeout(() => autoResizeTextarea(textarea), 0); }
        
        textarea.addEventListener('input', (e) => {
          note.text = e.target.value;
          saveNotes();
          autoResizeTextarea(e.target);
        });
        
        select.addEventListener('change', (e) => {
          note.category = e.target.value;
          saveNotes();
          if (currentFilter !== 'todas') renderNotes();
        });
        
        deleteBtn.addEventListener('click', () => {
          notes = notes.filter(n => n.id !== note.id);
          saveNotes();
          renderNotes();
        });
        notesContainer.appendChild(card);
      });
    }

    addNoteBtn.addEventListener('click', () => {
      const defaultCat = currentFilter === 'todas' ? 'trabajo' : currentFilter;
      notes.unshift({ id: Date.now(), text: '', category: defaultCat });
      saveNotes();
      renderNotes();
      const firstTxt = notesContainer.querySelector('.note-textarea');
      if (firstTxt) firstTxt.focus();
    });

    filterSelect.addEventListener('change', (e) => {
      currentFilter = e.target.value;
      if (currentFilter === 'todas') {
        filterLabel.textContent = '🔍 Filtrar: Todas';
      } else {
        filterLabel.textContent = `🔍 ${categories[currentFilter]}`;
      }
      renderNotes();
    });

    renderNotes();
  </script>
</body>
</html>
